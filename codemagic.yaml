workflows:
  android-workflow:
    name: Design Tracker Android Build
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Generate platform files
        script: |
          flutter create . --platforms=android
      - name: Add Firebase Google Services plugin
        script: |
          sed -i '/id("dev.flutter.flutter-plugin-loader") version "1.0.0"/a\    id("com.google.gms.google-services") version "4.4.2" apply false' android/settings.gradle.kts
          sed -i '/id("dev.flutter.flutter-gradle-plugin")/a\    id("com.google.gms.google-services")' android/app/build.gradle.kts
      - name: Get dependencies
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --debug
    artifacts:
      - build/**/outputs/**/*.apk
