workflows:
  android-workflow:
    name: Design Tracker Android Build
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Generate platform files
        script: |
          flutter create . --platforms=android
      - name: Get dependencies
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --debug
    artifacts:
      - build/**/outputs/**/*.apk
