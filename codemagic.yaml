workflows:
  android-workflow:
    name: Design Tracker Android Build
    max_build_duration: 60
    environment:
      # Keep "stable" — we still capture the exact resolved version below
      # and hand it to Shorebird, so both stages match.
      flutter: stable
      groups:
        - github
      vars:
        GITHUB_REPO_OWNER: "Scorpion-005"
        GITHUB_REPO_NAME: "design-process-tracker"
        # SHOREBIRD_MODE: "release" for the very first build (creates a full
        #   installable APK). Change to "patch" after that first build has
        #   been installed on your friend's phone — every push after that
        #   becomes a silent, no-install-needed update.
        SHOREBIRD_MODE: "release"
        # SHOREBIRD_TOKEN: add this as a Codemagic *secure* environment
        #   variable (get it by running `shorebird login:ci` on your
        #   laptop), not here in plain text.
    scripts:
      - name: Install Shorebird CLI
        script: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh | bash
          echo "PATH=$HOME/.shorebird/bin:$PATH" >> $CM_ENV
      - name: Detect Flutter version
        script: |
          # Capture exactly what "stable" resolved to this run, so the
          # Shorebird build step below uses the SAME Flutter version as
          # the pub get step.
          FLUTTER_VERSION=$(flutter --version --machine | python3 -c "import json,sys; print(json.load(sys.stdin)['frameworkVersion'])")
          echo "Detected Flutter version: $FLUTTER_VERSION"
          echo "FLUTTER_VERSION=$FLUTTER_VERSION" >> $CM_ENV
      # NOTE: The "flutter create . --platforms=android" step that used to be
      # here has been REMOVED. It was re-generating android/ from the newest
      # Flutter template on every build, silently overwriting our pinned
      # Gradle/AGP versions (android/gradle/wrapper/gradle-wrapper.properties
      # and android/settings.gradle.kts) with AGP 9+, which caused the
      # repeated "newDsl" build failures. The android/ folder is already
      # committed in the repo with the correct pinned versions, so we don't
      # need to regenerate it.
      - name: Add Firebase Google Services plugin
        script: |
          python3 - << 'PYEOF'
          settings = 'android/settings.gradle.kts'
          content = open(settings).read()
          if 'com.google.gms.google-services' not in content:
              content = content.replace(
                  'id("dev.flutter.flutter-plugin-loader") version "1.0.0"',
                  'id("dev.flutter.flutter-plugin-loader") version "1.0.0"\n    id("com.google.gms.google-services") version "4.4.2" apply false'
              )
              open(settings, 'w').write(content)

          appgradle = 'android/app/build.gradle.kts'
          content = open(appgradle).read()
          if 'com.google.gms.google-services' not in content:
              content = content.replace(
                  'id("dev.flutter.flutter-gradle-plugin")',
                  'id("dev.flutter.flutter-gradle-plugin")\n    id("com.google.gms.google-services")'
              )
              open(appgradle, 'w').write(content)
          PYEOF
      - name: Add notification permission
        script: |
          python3 - << 'PYEOF'
          manifest = 'android/app/src/main/AndroidManifest.xml'
          content = open(manifest).read()
          if 'POST_NOTIFICATIONS' not in content:
              content = content.replace(
                  '<application',
                  '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application',
                  1
              )
              open(manifest, 'w').write(content)
          PYEOF
      - name: Make Gradle downloads more patient
        script: |
          # A "Read timed out" while fetching gradle/AGP jars from
          # dl.google.com is a temporary network hiccup on the build
          # machine, not a code problem. Give downloads more time and
          # let Gradle retry them itself.
          touch android/gradle.properties
          if ! grep -q "internal.http.socketTimeout" android/gradle.properties; then
            {
              echo ""
              echo "systemProp.org.gradle.internal.http.connectionTimeout=180000"
              echo "systemProp.org.gradle.internal.http.socketTimeout=180000"
              echo "systemProp.org.gradle.internal.repository.max.retries=6"
              echo "systemProp.org.gradle.internal.repository.initial.backoff=1000"
            } >> android/gradle.properties
          fi
      - name: Get dependencies
        script: |
          flutter pub get
      - name: Build with Shorebird
        script: |
          echo "Using Flutter version: $FLUTTER_VERSION"
          if [ "$SHOREBIRD_MODE" = "patch" ]; then
            BUILD_CMD="shorebird patch android --flutter-version=$FLUTTER_VERSION"
          else
            BUILD_CMD="shorebird release android --artifact=apk --build-number=$BUILD_NUMBER --flutter-version=$FLUTTER_VERSION"
          fi
          # Retry up to 3 times: a failed build never uploads anything to
          # Shorebird, so trying again is safe, and it rides out temporary
          # network timeouts while downloading Gradle dependencies.
          SUCCESS=0
          for ATTEMPT in 1 2 3; do
            echo "=== Attempt $ATTEMPT of 3: $BUILD_CMD ==="
            if yes | $BUILD_CMD; then
              SUCCESS=1
              break
            fi
            echo "Attempt $ATTEMPT failed. Waiting 20s before retrying..."
            sleep 20
          done
          if [ "$SUCCESS" != "1" ]; then
            echo "All 3 attempts failed."
            exit 1
          fi
      - name: Publish GitHub Release with APK
        script: |
          if [ "$SHOREBIRD_MODE" = "patch" ]; then
            echo "Patch mode: nothing to publish, friend's app updates itself."
            exit 0
          fi
          APK_PATH=$(find . -path "*/outputs/*" -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK found. Listing all apk files in repo for debugging:"
            find . -name "*.apk" 2>/dev/null
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          TAG="$BUILD_NUMBER"
          NOTES=$(git log -8 --pretty=format:"- %s" | python3 -c "import json,sys; print(json.dumps(sys.stdin.read()))")
          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPO_OWNER/$GITHUB_REPO_NAME/releases" \
            -d "{\"tag_name\": \"$TAG\", \"name\": \"Build $TAG\", \"body\": $NOTES}" \
            > release_response.json
          UPLOAD_URL=$(python3 -c "import json;print(json.load(open('release_response.json'))['upload_url'].split('{')[0])")
          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"$APK_PATH" \
            "$UPLOAD_URL?name=app-release.apk"
    artifacts:
      - build/**/outputs/**/*.apk
